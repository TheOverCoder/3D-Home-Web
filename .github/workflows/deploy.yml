name: Deploy to GitHub Pages

# The site is published only from a commit the whole test suite passed on: once CI (ci.yml: the quick checks and the
# four e2e shards) finishes green for a push to the repository's default branch, whatever it is called, that commit
# is built and published. A push whose tests fail is never published; the site stays on the last green commit. CI
# cancels a run when a newer push comes, so only the newest commit is published. By hand: Run workflow (the default
# branch as it is).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the very commit the tests passed on (the branch may have moved on since)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: true # harmless unless large GLB/HDR files are tracked with Git LFS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # typecheck + vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages sometimes sits in "updating_pages" for longer than the 10-minute default
          timeout: 1800000
