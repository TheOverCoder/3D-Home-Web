name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the quick checks, beside the e2e shards: types, lint and the unit tests (no build, no browser), in about a minute
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    # the browser and every library it needs come in Playwright's own image (no apt during the job: GitHub's runners
    # could not always reach Ubuntu's mirrors); its version must be the one in package-lock.json (checked below). The
    # host's shared memory (--ipc=host, as Playwright advises for Chromium in Docker): the container's own 64 MB ran
    # short in software WebGL, and a graphics context restarted on purpose (11-startup) was lost again for want of it
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # the core suite: every test but the `@full` ones (stable tests that boot a page of their own, the budget walk's
    # other two sizes, ten times the farm, two of 16's groups), which run every night and by hand (full.yml). It renders
    # in software: six shards side by side, each a sixth of the spec files
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright matches the image
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          if [ "$v" != "1.63.0" ]; then echo "::error::@playwright/test is $v but the job's image is v1.63.0: move the image tag in ci.yml to v$v"; exit 1; fi
      - run: npx tsc --noEmit
      # the Playwright config builds and serves the app itself on port 4185
      - run: npx playwright test --grep-invert @full --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
