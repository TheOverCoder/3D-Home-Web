name: Full suite

# Every test, the `@full` ones included (ci.yml leaves them out of a push): stable tests that boot a page of their own,
# the budget walk at its other two sizes and at ten times the farm, and two of 16's groups. Every night, and by hand
# (Run workflow). It publishes nothing; a red night is the next thing to fix (GitHub mails the repository's owner).
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
