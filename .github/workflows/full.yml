name: Full suite

# Every test, the `@full` ones included (ci.yml leaves them out of a push): stable tests that boot a page of their own,
# the budget walk at ten times the farm, the counting check (26), and two of 16's groups. Every night, and by hand
# (Run workflow). It publishes nothing; a red night is the next thing to fix (GitHub mails the repository's owner).
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # eight shards dealt by each file's own time at night (scripts/ci-shards.mjs --full, tests/e2e/times.json's `full`),
      # not Playwright's --shard, which deals by the number of tests (all of 16 went into one shard of thirty minutes);
      # a test that passes only on its retry fails the night: a flake is seen the next morning, not hidden
      - run: |
          specs=$(node scripts/ci-shards.mjs --full ${{ matrix.shard }} 8)
          echo "$specs"
          TIMES_TABLE=full npx playwright test --fail-on-flaky-tests $specs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-full-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
